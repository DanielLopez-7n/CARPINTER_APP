<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - El Carpintero S.A.S.</title>
    <!-- Enlace al diseño CSS -->
    <link rel="stylesheet" href="/css/login.css">
    <!-- Google Fonts para que se vea profesional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>El Carpintero S.A.S.</h2>
                <p>Sistema de Gestión y Toma de Pedidos</p>
            </div>

            <!-- Formulario de Acceso -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="vendedor@elcarpintero.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div id="errorMensaje" class="error-msg hidden"></div>

                <button type="submit" id="btnSubmit" class="btn-primary">Ingresar al Sistema</button>
            </form>
        </div>
    </div>

    <!-- Script que conectará este HTML con tu API de Node.js -->
    <script src="/js/login.js"></script>
</body>
</html>
