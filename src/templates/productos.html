<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | El Carpintero S.A.S</title>
    <!-- CSS y Fuentes de Bootstrap y Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        body { min-height: 100vh; overflow-x: hidden; }
        .sidebar-bg { background-color: #111827; }
    </style>
</head>
<body class="d-flex bg-light">

    <!-- MENÚ LATERAL -->
    <aside class="sidebar-bg text-white d-flex flex-column flex-shrink-0 p-3 shadow" style="width: 280px; min-height: 100vh;">
        <a href="/" class="d-flex align-items-center mb-4 mt-2 mx-auto text-white text-decoration-none gap-2">
            <i class="ri-box-3-fill fs-2 text-primary"></i>
            <h3 class="mb-0 fw-bold">El Carpintero</h3>
        </a>
        <hr class="border-secondary mb-4">
        <ul class="nav nav-pills flex-column mb-auto gap-2">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link text-white py-3 d-flex align-items-center rounded-3">
                    <i class="ri-dashboard-3-line fs-5 me-3"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="/envios" class="nav-link text-white py-3 d-flex align-items-center rounded-3">
                    <i class="ri-truck-line fs-5 me-3"></i> Envíos
                </a>
            </li>
            <li class="nav-item">
                <a href="/envios/nuevo_envio" class="nav-link text-white py-3 d-flex align-items-center rounded-3">
                    <i class="ri-add-box-line fs-5 me-3"></i> Nuevo Envío
                </a>
            </li>
            <li class="nav-item">
                <!-- Este botón ahora tiene la clase 'active' para indicar que estamos aquí -->
                <a href="/productos" class="nav-link active py-3 d-flex align-items-center shadow-sm rounded-3">
                    <i class="ri-box-3-line fs-5 me-3"></i> Catálogo
                </a>
            </li>
        </ul>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow-1 d-flex flex-column" style="max-height: 100vh; overflow-y: auto;">
        
        <!-- BARRA SUPERIOR -->
        <header class="navbar navbar-light bg-white border-bottom shadow-sm px-4 py-3">
            <div class="container-fluid px-0">
                <h4 class="mb-0 fw-bold text-dark">Gestión de Catálogo</h4>
                <div class="d-flex align-items-center gap-4">
                    <div class="d-flex align-items-center text-secondary">
                        <div class="bg-light rounded-circle p-2 me-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                            <i class="ri-user-3-fill fs-5 text-primary"></i>
                        </div>
                        <span id="usuarioActual" class="fw-semibold text-dark">Usuario</span>
                    </div>
                    <button id="btnLogOut" class="btn btn-danger d-flex align-items-center gap-2 fw-semibold px-3 py-2 shadow-sm rounded-3">
                        <i class="ri-logout-box-r-line"></i> Salir
                    </button>
                </div>
            </div>
        </header>

        <!-- ÁREA DEL CATÁLOGO -->
        <div class="container-fluid p-4 p-md-5">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="text-primary fw-bold mb-0">CATÁLOGO DE PRODUCTOS</h2>
                <button id="btn-nuevo-producto" class="btn btn-success fw-bold shadow-sm d-flex align-items-center gap-2">
                    <i class="ri-add-line"></i> Nuevo Producto
                </button>
            </div>

            <!-- BUSCADOR Y FILTROS -->
            <div class="row mb-4 g-3">
                <div class="col-12 col-md-6">
                    <div class="input-group shadow-sm">
                        <span class="input-group-text bg-white border-end-0"><i class="ri-search-line text-muted"></i></span>
                        <input type="text" id="inputBusqueda" class="form-control border-start-0" placeholder="Buscar por código o nombre del producto...">
                    </div>
                </div>
                <div class="col-12 col-md-4">
                    <select id="selectCategoria" class="form-select shadow-sm">
                        <option value="todas">Todos los grupos</option>
                    </select>
                </div>
                <div class="col-12 col-md-2 text-end d-flex align-items-center justify-content-end">
                    <span class="badge bg-primary rounded-pill p-2 fs-6 shadow-sm" id="contadorProductos">0 productos</span>
                </div>
            </div>

            <!-- TABLA DE PRODUCTOS -->
            <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped align-middle mb-0" id="tabla-productos">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4 py-3">Código</th>
                                    <th class="py-3">Artículo</th>
                                    <th class="py-3">Grupo</th>
                                    <th class="py-3">Referencia</th>
                                    <th class="py-3">Existencia</th>
                                    <th class="text-center py-3">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpo-tabla-productos">
                                <tr>
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <div class="spinner-border text-primary mb-3" role="status"></div>
                                        <p class="mb-0">Cargando catálogo...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div> 
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Importamos el JS del catálogo -->
    <script src="/js/productos.js"></script>
</body>
</html>
